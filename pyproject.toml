[project]
name = "audio-tools"
version = "1.0.0"
description = "Hi-Res Vault Companion & 7-Pillar Audiophile Studio for Navidrome"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "mutagen>=1.47.0",
    "mediafile>=0.17.0",
    "numpy>=1.26.0",
    "dr14meter>=1.1.5",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["core"]
py-modules = ["app", "check_hires", "organize_library"]
